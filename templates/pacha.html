<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kartis — Pacha NYC</title>
<style>
  :root {
    --bg: #f7f8fa; --bg-2: #ffffff; --bg-3: #eef1f5; --line: #e3e7ec; --line-2: #d3dae1;
    --text: #24292f; --muted: #6e7681; --accent: #0969da; --green: #1a7f37;
    --red: #d1242f; --amber: #9a6700; --orange: #ea580c; --purple: #8250df;
    --cyan: #0f766e; --pink: #e91e63;
  }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header .left { display: flex; align-items: baseline; gap: 24px; }
  header h1 { margin: 0; font-size: 14px; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; color: var(--pink); }
  header .meta { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  main { padding: 18px 24px 60px; }
  h2 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin: 26px 0 10px; }
  h2:first-child { margin-top: 0; }
  .sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin: 0 0 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 8px; }
  .stat { background: var(--bg); padding: 14px 16px; }
  .stat .label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .stat .value { font-size: 26px; color: var(--pink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .value.green { color: var(--green); }
  .stat .value.zero { color: var(--muted); }
  .stat .hint { font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-top: 3px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  input[type=text] { background: var(--bg-2); border: 1px solid var(--line-2); color: var(--text); font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 6px; width: 220px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-size: 10px; padding: 8px 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th .arrow { color: var(--accent); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr.ev { cursor: pointer; }
  tbody tr.ev:hover td { background: var(--bg-3); }
  tbody tr.lowrow td { background: rgba(209, 36, 47, 0.06); }
  tbody tr.lowrow:hover td { background: rgba(209, 36, 47, 0.11); }
  tr.tiers td { background: var(--bg-2); padding: 4px 10px 10px 26px; font-size: 11px; color: var(--muted); }
  tr.tiers .tier { padding: 2px 0; }
  tr.tiers .tier b { color: var(--text); }
  tr.tiers .rh { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
  tr.tiers .rh .rhh { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 3px; }
  tr.tiers .rel-row { padding: 1px 0; }
  tr.tiers .rel-row .so { color: var(--red); }
  tr.tiers .rel-row .op { color: var(--green); }
  tr.tiers .bar { display: inline-block; width: 90px; height: 6px; background: var(--bg-3); border-radius: 3px; margin: 0 8px; vertical-align: middle; overflow: hidden; }
  tr.tiers .bar i { display: block; height: 100%; background: var(--pink); }
  tr.tiers .pctlbl { font-size: 10px; color: var(--muted); margin-right: 6px; }
  tr.tiers .pctlbl.hot { color: var(--red); font-weight: 600; }
  a.buy { color: #fff; background: var(--pink); text-decoration: none; font-size: 10px; letter-spacing: 1px; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
  a.buy.off { background: var(--line-2); color: var(--muted); pointer-events: none; }
  .when { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 10px; font-weight: 600; color: #fff; white-space: nowrap; }
  .badge.available { background: #16a34a; }
  .badge.waitlist { background: #7c3aed; }
  .badge.soldout { background: #dc2626; }
  .badge.low { background: #d1242f; }
  .rel { font-size: 10px; color: var(--muted); }
  .vel { font-variant-numeric: tabular-nums; }
  .vel.zero { color: var(--muted); }
  .vel.hot { color: var(--green); font-weight: 600; }
  .vel .star { color: var(--amber); }
  .pace { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pace .up { color: var(--green); font-weight: 600; }
  .pace .down { color: var(--red); font-weight: 600; }
  .pace .flat, .pace .na { color: var(--muted); }
  .pace .rate { font-size: 10px; color: var(--muted); }
  .spark { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .spark rect { fill: var(--pink); }
  .spark rect.today { opacity: .35; }
  .daily { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); position: relative; }
  .daily .rhh { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
  .daily .sum { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .daily .sum b { color: var(--text); }
  .chart { width: 100%; max-width: 900px; overflow-x: auto; }
  .chart svg { display: block; }
  .chart .dbar { fill: var(--pink); }
  .chart .dbar.today { opacity: .4; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart g:hover .dbar { opacity: .75; }
  .chart.click .hit { cursor: pointer; }
  .chart .dbar.sel { stroke: var(--text); stroke-width: 1.5; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; margin: 0 0 8px; }
  .seg button { border: 0; background: var(--bg-2); color: var(--muted); font: inherit; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; cursor: pointer; }
  .seg button.on { background: var(--pink); color: #fff; }
  .daily a.lnk { color: var(--accent); text-decoration: none; margin-left: 8px; font-size: 10px; letter-spacing: 1px; text-transform: none; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .axis { fill: var(--muted); font-size: 9px; }
  .chart .vlbl { fill: var(--text); font-size: 9px; font-variant-numeric: tabular-nums; }
  .chart .plbl { fill: var(--purple); font-size: 9px; font-weight: 600; }
  .chart .pmark { stroke: var(--purple); stroke-width: 1; stroke-dasharray: 2 2; }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg-2); font-size: 11px; padding: 6px 9px; border-radius: 6px; z-index: 50; display: none; white-space: nowrap; line-height: 1.45; }
  #overview { background: var(--bg-2); border: 1px solid var(--line); padding: 10px 12px 6px; margin-bottom: 8px; }
  #overview:empty { display: none; }
  .empty { color: var(--muted); padding: 40px; text-align: center; font-size: 12px; }
  .err { background: #fdecea; border: 1px solid var(--red); color: var(--red); padding: 8px 12px; margin-bottom: 14px; font-size: 12px; display: none; }
</style>
</head>
<body>
{% include "_sidebar.html" %}
<header>
  <div class="left">
    <h1>PACHA NYC</h1>
    <span class="meta" id="meta">—</span>
  </div>
</header>
<main>
  <div class="err" id="errbox"></div>

  <div class="stats" id="totals"></div>
  <p class="sub" id="statusline">—</p>

  <h2 id="ovTitle">Sold per day <span class="rel">(all events, New York days)</span></h2>
  <div id="overview"></div>

  <h2>Events <span class="rel">(click a row for the tier breakdown)</span></h2>
  <div class="controls"><input type="text" id="q" placeholder="filter by artist…" /></div>
  <div class="tablewrap">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
  <p class="sub" id="footnote"></p>
</main>
<div class="tip" id="tip"></div>

<script>
const $ = id => document.getElementById(id);
function escape(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
const fmt = n => (n == null) ? '—' : n.toLocaleString();
const money = n => (n == null) ? '—' : '$' + n.toLocaleString();

let DATA = null;
let sortKey = 'date';
let sortDir = 1;
const open = new Set();

const COLS = [
  { key:'name',  label:'Event' },
  { key:'date',  label:'Date' },
  { key:'status',label:'Status' },
  { key:'ga',    label:'GA release', num:true },
  { key:'left',  label:'Total left', num:true },
  { key:'w1h',   label:'+1h', num:true },
  { key:'w6h',   label:'+6h', num:true },
  { key:'w24h',  label:'+24h', num:true },
  { key:'w3d',   label:'+3d', num:true },
  { key:'w7d',   label:'+7d', num:true },
  { key:'scum',  label:'Σ Sold', num:true },
  { key:'pace',  label:'Pace (3d vs prior 3d)' },
  { key:'price', label:'GA $', num:true },
  { key:'buy',   label:'' },
];

function sortVal(e, key){
  const w = k => { const v = (e.windows||{})[k]; return v && v.sold != null ? v.sold : -1; };
  switch(key){
    case 'name': return (e.name||'').toLowerCase();
    case 'date': return e.start_date || '9999';
    case 'status': return e.on_sale ? 0 : 1;
    case 'ga': return e.ga_available == null ? Infinity : e.ga_available;
    case 'left': return e.total_available == null ? -1 : e.total_available;
    case 'w1h': return w('1h'); case 'w6h': return w('6h'); case 'w24h': return w('24h');
    case 'w3d': return w('3d'); case 'w7d': return w('7d');
    case 'scum': return e.sold_cum == null ? -1 : e.sold_cum;
    case 'pace': { const p = pace(e); return p.change == null ? -Infinity : p.change; }
    case 'price': return e.ga_price == null ? Infinity : e.ga_price;
    default: return 0;
  }
}

function renderHead(){
  $('head').innerHTML = COLS.map(c => {
    const arrow = sortKey === c.key ? `<span class="arrow">${sortDir < 0 ? '▼' : '▲'}</span>` : '';
    return `<th class="${c.num ? 'num' : ''}" data-key="${c.key}">${c.label} ${arrow}</th>`;
  }).join('');
  $('head').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.key;
    if (!k || k === 'buy') return;
    if (sortKey === k) sortDir = -sortDir;
    else { sortKey = k; sortDir = (k === 'name' || k === 'date') ? 1 : -1; }
    render();
  });
}

function velCell(w){
  if (!w || w.sold == null) return '<td class="num vel zero">—</td>';
  const star = w.partial ? '<span class="star" title="limited history">*</span>' : '';
  const cls = w.sold === 0 ? 'zero' : (w.sold >= 25 ? 'hot' : '');
  return `<td class="num vel ${cls}">${fmt(w.sold)}${star}</td>`;
}

// ---- sold per day -------------------------------------------------------
// e.daily = [{day:'YYYY-MM-DD', sold, available, ga_price, ga_release}] in NY
// days, one row per day the monitor ran. Gaps (monitor down) are filled as
// null = unknown, never 0, so an outage never looks like a slump.
const DAY_MS = 86400000;
const dayNum = d => Math.round(Date.parse(d + 'T00:00:00Z') / DAY_MS);
const dayStr = n => new Date(n * DAY_MS).toISOString().slice(0, 10);
const md = d => d.slice(5).replace('-', '/');
const dow = d => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d + 'T00:00:00Z').getUTCDay()];

function dailySeries(e, maxDays){
  const rows = e.daily || [];
  if (!rows.length) return [];
  const by = Object.fromEntries(rows.map(r => [r.day, r]));
  let a = dayNum(rows[0].day);
  const b = dayNum(DATA.today || rows[rows.length - 1].day);
  if (maxDays && b - a + 1 > maxDays) a = b - maxDays + 1;
  const show = e.start_date ? dayNum(e.start_date.slice(0, 10)) : null;
  const out = [];
  for (let n = a; n <= b; n++){
    const d = dayStr(n), r = by[d];
    out.push({ day: d, sold: r ? r.sold : null, ga_price: r ? r.ga_price : null, tiers_sold: r ? r.tiers_sold : null,
               ga_release: r ? r.ga_release : null, available: r ? r.available : null,
               today: d === DATA.today, out: show != null ? show - n : null });
  }
  return out;
}

// Average sold/day over the last 3 COMPLETE days vs the 3 before (today is
// partial, so it's left out). Needs every one of those 6 days recorded.
function pace(e){
  const s = dailySeries(e).filter(x => !x.today);
  const avg = xs => xs.length === 3 && xs.every(x => x.sold != null) ? xs.reduce((a, x) => a + x.sold, 0) / 3 : null;
  const recent = avg(s.slice(-3)), prior = avg(s.slice(-6, -3));
  let change = null;
  if (recent != null && prior != null) change = prior === 0 ? (recent > 0 ? 1 : 0) : (recent - prior) / prior;
  return { recent, prior, change };
}

function sparkSvg(e){
  const s = dailySeries(e, 14);
  if (!s.length) return '';
  const W = 4, G = 1, H = 18, max = Math.max(1, ...s.map(x => x.sold || 0));
  const bars = s.map((x, i) => {
    if (x.sold == null) return '';
    const h = Math.max(x.sold ? 1.5 : 0.5, x.sold / max * H);
    return `<rect class="${x.today ? 'today' : ''}" x="${i * (W + G)}" y="${H - h}" width="${W}" height="${h}" rx="1"></rect>`;
  }).join('');
  return `<svg class="spark" width="${s.length * (W + G)}" height="${H}" aria-hidden="true">${bars}</svg>`;
}

function paceCell(e){
  const p = pace(e);
  const spark = sparkSvg(e);
  if (p.change == null)
    return `<td class="pace">${spark}<span class="na" title="needs 6 full days of tracking">—</span></td>`;
  const pct = Math.round(p.change * 100);
  const cls = pct >= 15 ? 'up' : pct <= -15 ? 'down' : 'flat';
  const arrow = cls === 'up' ? '▲' : cls === 'down' ? '▼' : '•';
  const title = `last 3 days ${p.recent.toFixed(1)}/day vs ${p.prior.toFixed(1)}/day the 3 days before`;
  return `<td class="pace" title="${title}">${spark}<span class="${cls}">${arrow} ${pct > 0 ? '+' : ''}${pct}%</span> <span class="rate">${p.recent.toFixed(1)}/d</span></td>`;
}

// Bar chart, one bar per day. tipFn(x) -> tooltip html.
// opts: axis(x,i) -> [line1, line2] | null (label this bar?), onClick(x),
// selected(x) -> bool. Default axis = every ~nth day with "d out".
function barChart(s, tipFn, opts = {}){
  const BW = Math.max(6, Math.min(22, Math.floor(860 / Math.max(1, s.length)) - 2)), GAP = 2;
  const L = 34, T = 16, H = 120, B = 30;
  const W = L + s.length * (BW + GAP) + 8;
  const max = Math.max(1, ...s.map(x => x.sold || 0));
  const step = max <= 5 ? 1 : Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const top = Math.ceil(max / step) * step;
  const y = v => T + H - v / top * H;
  let g = '';
  for (let v = 0; v <= top; v += step)
    g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"></line><text class="axis" x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  const every = Math.ceil(s.length / 14);
  const axis = opts.axis || ((x, i) => ((i % every === 0 && s.length - 1 - i >= every) || i === s.length - 1)
    ? [md(x.day), x.out != null && x.out >= 0 ? x.out + 'd out' : ''] : null);
  // Label only the peak and the latest complete day — not every bar.
  const complete = s.filter(x => !x.today && x.sold != null);
  const peak = complete.reduce((m, x) => (m && m.sold >= x.sold ? m : x), null);
  const last = complete[complete.length - 1];
  let prevPrice = null;
  s.forEach((x, i) => {
    const bx = L + i * (BW + GAP);
    if (x.sold != null){
      const h = x.sold ? Math.max(2, x.sold / top * H) : 0;
      g += `<g data-i="${i}"><rect class="hit" x="${bx - 1}" y="${T}" width="${BW + GAP}" height="${H}"></rect>` +
           `<rect class="dbar${x.today ? ' today' : ''}${opts.selected && opts.selected(x) ? ' sel' : ''}" x="${bx}" y="${T + H - h}" width="${BW}" height="${h}" rx="2"></rect></g>`;
      if (x === peak || x === last)
        g += `<text class="vlbl" x="${bx + BW / 2}" y="${T + H - h - 3}" text-anchor="middle">${x.sold}</text>`;
    } else {
      g += `<g data-i="${i}"><rect class="hit" x="${bx - 1}" y="${T}" width="${BW + GAP}" height="${H}"></rect></g>`;
    }
    if (x.ga_price != null && prevPrice != null && x.ga_price !== prevPrice)
      g += `<line class="pmark" x1="${bx - 1}" x2="${bx - 1}" y1="${T - 4}" y2="${T + H}"></line><text class="plbl" x="${bx + 1}" y="${T - 6}">$${x.ga_price}</text>`;
    if (x.ga_price != null) prevPrice = x.ga_price;
    const lab = axis(x, i);
    if (lab){
      g += `<text class="axis" x="${bx + BW / 2}" y="${T + H + 12}" text-anchor="middle">${lab[0] || ''}</text>`;
      if (lab[1]) g += `<text class="axis" x="${bx + BW / 2}" y="${T + H + 23}" text-anchor="middle">${lab[1]}</text>`;
    }
  });
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  CHART_TIPS[id] = { s, tipFn, onClick: opts.onClick };
  return `<div class="chart${opts.onClick ? ' click' : ''}"><svg id="${id}" width="${W}" height="${T + H + B}" role="img">${g}</svg></div>`;
}
const CHART_TIPS = {};
function wireCharts(root){
  const tip = $('tip');
  for (const k in CHART_TIPS) if (!document.getElementById(k)) delete CHART_TIPS[k];
  root.querySelectorAll('.chart svg').forEach(svg => {
    const c = CHART_TIPS[svg.id]; if (!c) return;
    svg.addEventListener('click', ev => ev.stopPropagation());
    svg.querySelectorAll('g[data-i]').forEach(gEl => {
      gEl.addEventListener('mousemove', ev => {
        tip.innerHTML = c.tipFn(c.s[+gEl.dataset.i]);
        tip.style.display = 'block';
        const r = tip.getBoundingClientRect();
        tip.style.left = Math.min(window.innerWidth - r.width - 8, ev.clientX + 12) + 'px';
        tip.style.top = (ev.clientY - r.height - 10) + 'px';
      });
      gEl.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
      if (c.onClick) gEl.addEventListener('click', () => { tip.style.display = 'none'; c.onClick(c.s[+gEl.dataset.i]); });
    });
  });
}

// "General Admission - Release 2: 14" lines, biggest first. Only ticks
// since the breakdown shipped carry it, so older bars just show the total.
function tierLines(ts){
  const ents = Object.entries(ts || {}).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  if (!ents.length) return '';
  const shown = ents.slice(0, 8).map(([name, n]) => `&nbsp;&nbsp;${escape(name)}: <b>${n.toLocaleString()}</b>`);
  if (ents.length > 8) shown.push(`&nbsp;&nbsp;+${ents.length - 8} more types: ${ents.slice(8).reduce((a, [, n]) => a + n, 0)}`);
  return '<br>' + shown.join('<br>');
}

function eventTip(x){
  const lines = [`<b>${dow(x.day)} ${md(x.day)}</b>${x.out != null && x.out >= 0 ? ` · ${x.out}d before show` : ''}`];
  lines.push(x.sold == null ? 'not tracked (monitor down)' : `${x.sold} sold${x.today ? ' so far today' : ''}${tierLines(x.tiers_sold)}`);
  if (x.available != null) lines.push(`${x.available.toLocaleString()} left at end of day`);
  if (x.ga_price != null) lines.push(`GA $${x.ga_price}${x.ga_release ? ' · ' + escape(x.ga_release) : ''}`);
  return lines.join('<br>');
}

// ---- sold per hour --------------------------------------------------------
// Fetched lazily from /api/pacha/hourly (NY clock hours) and cached; every
// page refresh marks the cache stale, which refetches only what's on screen
// while the old copy keeps showing.
const HOURLY = {};
const hourlySel = {};          // event_id -> 'YYYY-MM-DD' (null = last 48h)
let ovMode = 'daily', ovDay = null;
function getHourly(ev, day, rerender){
  const k = (ev || '*') + '|' + (day || '48h');
  const c = HOURLY[k];
  if (!c || (c.stale && !c.loading)){
    HOURLY[k] = Object.assign(c || {}, { loading: true });
    const q = new URLSearchParams(); if (ev) q.set('event', ev); if (day) q.set('day', day); else q.set('hours', '48');
    fetch('/api/pacha/hourly?' + q).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(d => { HOURLY[k] = { data: d }; rerender(); })
      .catch(err => { HOURLY[k] = { error: err.message, data: (c || {}).data }; rerender(); });
  }
  return HOURLY[k];
}
const hr12 = h => (h % 12 || 12) + (h < 12 ? 'a' : 'p');
function hourSeries(d){
  return (d.hours || []).map(r => Object.assign({}, r, { today: r.hour === d.now_hour,
    h: +r.hour.slice(11, 13), day: r.hour.slice(0, 10) }));
}
function hourAxis(s){
  const every = s.length <= 26 ? 3 : 6;
  return (x, i) => (x.h % every === 0 || i === 0)
    ? [hr12(x.h), (x.h === 0 || i === 0) ? `${dow(x.day)} ${md(x.day)}` : ''] : null;
}
function hourTip(x, scope){
  const lines = [`<b>${dow(x.day)} ${md(x.day)} · ${hr12(x.h)}–${hr12((x.h + 1) % 24)}</b> NY time`];
  lines.push(x.sold == null ? 'not tracked (monitor down)'
    : `${x.sold} sold${x.today ? ' so far this hour' : ''}${x.events ? ` across ${x.events} events` : ''}${tierLines(x.tiers_sold)}`);
  if (x.available != null) lines.push(`${x.available.toLocaleString()} left at end of hour`);
  if (x.ga_price != null) lines.push(`GA $${x.ga_price}`);
  return lines.join('<br>');
}
function hourSummary(s){
  const got = s.filter(x => x.sold != null);
  if (!got.length) return '';
  const total = got.reduce((a, x) => a + x.sold, 0);
  const best = got.reduce((m, x) => (m && m.sold >= x.sold ? m : x), null);
  // When during the day it sells: sum by clock hour across the window.
  const byH = {}; got.forEach(x => byH[x.h] = (byH[x.h] || 0) + x.sold);
  const top = Object.entries(byH).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([h]) => hr12(+h));
  return `<b>${total.toLocaleString()}</b> sold in these ${s.length} hours` +
    (best && best.sold ? ` · busiest hour <b>${best.sold}</b> (${dow(best.day)} ${hr12(best.h)})` : '') +
    (top.length ? ` · most sales around ${top.join(', ')}` : '');
}
function hourlyBlock(e){
  const day = hourlySel[e.event_id] || null;
  const c = getHourly(e.event_id, day, render);
  const back = day ? `<a href="#" class="lnk" data-back="${e.event_id}">← last 48h</a>` : '';
  const head = `<div class="rhh">Sold per hour — ${day ? `${dow(day)} ${md(day)}` : 'last 48 hours'} (NY time)${back}</div>`;
  if (!c.data) return `<div class="daily">${head}<div class="sum">${c.error ? 'Failed to load: ' + escape(c.error) : 'Loading…'}</div></div>`;
  const s = hourSeries(c.data);
  if (!s.some(x => x.sold != null)) return `<div class="daily">${head}<div class="sum">No hourly data for this window yet.</div></div>`;
  return `<div class="daily">${head}<div class="sum">${hourSummary(s)}</div>` +
    barChart(s, hourTip, { axis: hourAxis(s) }) +
    `<div class="sum">Click a bar in the daily chart above to see that day hour by hour. Purple line = GA price changed in that hour.</div></div>`;
}

function dailyBlock(e){
  const s = dailySeries(e);
  if (!s.length) return '<div class="daily"><div class="rhh">Sold per day</div><div class="sum">No daily history yet — fills in from the next check.</div></div>';
  const p = pace(e);
  const done = s.filter(x => !x.today && x.sold != null);
  const best = done.reduce((m, x) => (m && m.sold >= x.sold ? m : x), null);
  const bits = [];
  if (p.recent != null) bits.push(`last 3 days <b>${p.recent.toFixed(1)}/day</b>` + (p.prior != null ? ` vs ${p.prior.toFixed(1)}/day before` : ''));
  if (best) bits.push(`best day <b>${best.sold}</b> (${dow(best.day)} ${md(best.day)})`);
  if (p.recent && e.total_available != null && e.start_date){
    const daysLeft = dayNum(e.start_date.slice(0, 10)) - dayNum(DATA.today);
    const proj = Math.round(p.recent * Math.max(0, daysLeft));
    bits.push(`at this pace ~<b>${proj.toLocaleString()}</b> more by show day (${fmt(e.total_available)} left now)`);
  }
  return `<div class="daily"><div class="rhh">Sold per day — since ${md(s[0].day)}</div>` +
         `<div class="sum">${bits.join(' · ') || '—'}</div>` +
         barChart(s, eventTip, { onClick: x => { hourlySel[e.event_id] = x.day; render(); },
                                 selected: x => x.day === hourlySel[e.event_id] }) +
         `<div class="sum">Faded bar = today so far. Purple line = GA price changed (new release). "d out" = days before the show. Click a day for its hours.</div></div>` +
         hourlyBlock(e);
}

function renderOverview(){
  const evs = DATA.events || [];
  const seg = `<div class="seg"><button data-m="daily" class="${ovMode === 'daily' ? 'on' : ''}">Daily</button>` +
              `<button data-m="hourly" class="${ovMode === 'hourly' ? 'on' : ''}">Hourly</button></div>`;
  if (ovMode === 'hourly'){
    const c = getHourly(null, ovDay, renderOverview);
    $('ovTitle').innerHTML = `Sold per hour <span class="rel">(all events, ${ovDay ? dow(ovDay) + ' ' + md(ovDay) : 'last 48 hours'}, New York time)</span>`;
    let body;
    if (!c.data) body = `<div class="sum rel">${c.error ? 'Failed to load: ' + escape(c.error) : 'Loading…'}</div>`;
    else {
      const s = hourSeries(c.data);
      body = `<div class="rel" style="margin-bottom:4px">${hourSummary(s)}${ovDay ? ' · <a href="#" id="ov48" style="color:var(--accent);text-decoration:none">last 48h</a>' : ''}</div>` +
             barChart(s, hourTip, { axis: hourAxis(s) });
    }
    $('overview').innerHTML = seg + body;
  } else {
    $('ovTitle').innerHTML = `Sold per day <span class="rel">(all events, New York days · click a day for its hours)</span>`;
    const tot = {};
    evs.forEach(e => (e.daily || []).forEach(r => {
      const t = tot[r.day] || (tot[r.day] = { sold: 0, events: 0, tiers: {} });
      t.sold += r.sold; t.events += 1;
      for (const [n, v] of Object.entries(r.tiers_sold || {})) t.tiers[n] = (t.tiers[n] || 0) + v;
    }));
    const days = Object.keys(tot).sort();
    if (!days.length){ $('overview').innerHTML = seg + '<div class="rel">No daily history yet.</div>'; }
    else {
      const b = dayNum(DATA.today || days[days.length - 1]);
      const a = Math.max(dayNum(days[0]), b - 59);
      const s = [];
      for (let n = a; n <= b; n++){
        const d = dayStr(n), t = tot[d];
        s.push({ day: d, sold: t ? t.sold : null, events: t ? t.events : 0, today: d === DATA.today, out: null, ga_price: null, tiers_sold: t ? t.tiers : null });
      }
      $('overview').innerHTML = seg + barChart(s, x =>
        `<b>${dow(x.day)} ${md(x.day)}</b><br>` + (x.sold == null ? 'not tracked' : `${x.sold} sold${x.today ? ' so far today' : ''} across ${x.events} events${tierLines(x.tiers_sold)}`),
        { onClick: x => { ovMode = 'hourly'; ovDay = x.day; renderOverview(); } });
    }
  }
  $('overview').querySelectorAll('.seg button').forEach(b => b.onclick = () => { ovMode = b.dataset.m; ovDay = null; renderOverview(); });
  const o48 = $('ov48'); if (o48) o48.onclick = ev => { ev.preventDefault(); ovDay = null; renderOverview(); };
  wireCharts($('overview'));
}

function tierRows(e){
  let html = !(e.tiers||[]).length ? '<div class="tier">No tier data yet — fills in on the next 10-min check.</div>'
    : e.tiers.map(t => {
      const has = t.available != null && t.quantity;
      const pctLeft = has ? Math.max(0, Math.min(100, t.available / t.quantity * 100)) : 0;
      const pctSold = has ? Math.round(100 - pctLeft) : null;
      const counts = t.available != null ? `<b>${fmt(t.available)}</b>${t.quantity ? ' of ' + fmt(t.quantity) : ''} left` : 'no count';
      const sold = (t.used != null && t.used > 0) ? ` · ${fmt(t.used)} sold` : '';
      return `<div class="tier">${escape(t.name || 'Tickets')} — ${counts}${sold}` +
             (has ? `<span class="bar"><i style="width:${pctLeft}%"></i></span>` +
                    `<span class="pctlbl${pctSold >= 80 ? ' hot' : ''}">${pctSold}% sold</span>` : '') +
             (t.price != null ? ` ${money(t.price)}` : '') + `</div>`;
    }).join('');
  html += releaseHistory(e);
  html += dailyBlock(e);
  return html;
}

function releaseHistory(e){
  const rel = e.releases || [];
  if (!rel.length) return '';
  const released = rel.map(r => r.quantity).filter(x => x != null).reduce((a,b)=>a+b, 0);
  const prices = rel.map(r => r.price).filter(x => x != null);
  const walk = prices.length > 1 ? ` · price ${money(Math.min(...prices))} → ${money(Math.max(...prices))}` : '';
  const day = iso => iso ? iso.slice(5,10).replace('-','/') : '?';
  const lines = rel.map(r => {
    const end = r.sold_out_at
      ? (r.available_last === 0
          ? `<span class="so">sold out ${day(r.sold_out_at)}</span>`
          : `<span class="so">removed ${day(r.sold_out_at)} (${fmt(r.available_last)} unsold)</span>`)
      : `<span class="op">open</span>`;
    return `<div class="rel-row">${escape(r.name)} — ${r.quantity != null ? fmt(r.quantity) + ' tickets' : '?'}` +
           `${r.price != null ? ' @ ' + money(r.price) : ''} · seen ${day(r.first_seen_at)} · ${end}</div>`;
  }).join('');
  return `<div class="rh"><div class="rhh">Release history — ${rel.length} release${rel.length>1?'s':''}, ${fmt(released)} tickets logged${walk}</div>${lines}</div>`;
}

function render(){
  if (!DATA) return;
  renderHead();
  const q = ($('q').value || '').trim().toLowerCase();
  const thr = DATA.low_stock_threshold || 20;
  let evs = (DATA.events || []);
  if (q) evs = evs.filter(e => (e.name||'').toLowerCase().includes(q));
  evs.sort((a,b) => { const va = sortVal(a, sortKey), vb = sortVal(b, sortKey);
    return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir; });
  if (!evs.length) {
    $('rows').innerHTML = `<tr><td colspan="${COLS.length}" class="empty">Nothing here — the monitor populates this every 10 minutes.</td></tr>`;
    return;
  }
  $('rows').innerHTML = evs.map(e => {
    const low = e.on_sale && e.ga_available != null && e.ga_available <= thr;
    const st = !e.on_sale ? '<span class="badge waitlist">Waitlist</span>'
      : (e.ga_sold_out && !e.total_available) ? '<span class="badge soldout">Sold out</span>'
      : low ? `<span class="badge low">≤${thr} left!</span>`
      : '<span class="badge available">On sale</span>';
    const gaCell = e.ga_available == null ? '—' :
      `<div>${fmt(e.ga_available)}${e.ga_quantity ? ' / ' + fmt(e.ga_quantity) : ''}</div>` +
      (e.ga_release ? `<div class="rel">${escape(e.ga_release)}</div>` : '');
    const scumTitle = e.sold_cum_since ? ` title="sold since ${escape(e.sold_cum_since.slice(0,10))}"` : '';
    const opened = open.has(e.event_id);
    return `<tr class="ev${low ? ' lowrow' : ''}" data-id="${e.event_id}">
      <td><b>${escape(e.name || e.slug)}</b></td>
      <td class="when">${escape((e.date_text||'').replace(' | ', ' '))}</td>
      <td>${st}</td>
      <td class="num">${gaCell}</td>
      <td class="num">${fmt(e.total_available)}</td>
      ${velCell((e.windows||{})['1h'])}${velCell((e.windows||{})['6h'])}${velCell((e.windows||{})['24h'])}${velCell((e.windows||{})['3d'])}${velCell((e.windows||{})['7d'])}
      <td class="num"${scumTitle}>${fmt(e.sold_cum)}</td>
      ${paceCell(e)}
      <td class="num">${money(e.ga_price)}</td>
      <td><a class="buy${e.on_sale ? '' : ' off'}" href="${escape(e.slug ? 'https://pacha-nyc.com/event/' + e.slug + '#tickets' : (e.buy_url||'#'))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">BUY</a></td>
    </tr>` + (opened ? `<tr class="tiers"><td colspan="${COLS.length}">${tierRows(e)}</td></tr>` : '');
  }).join('');
  $('rows').querySelectorAll('tr.ev').forEach(tr => tr.onclick = () => {
    const id = tr.dataset.id;
    open.has(id) ? open.delete(id) : open.add(id);
    render();
  });
  $('rows').querySelectorAll('a[data-back]').forEach(a => a.onclick = ev => {
    ev.preventDefault(); ev.stopPropagation(); hourlySel[a.dataset.back] = null; render();
  });
  wireCharts($('rows'));
}

function fmtAgo(iso){
  if (!iso) return '—';
  const secs = (Date.now() - new Date(iso).getTime())/1000;
  if (secs < 90) return 'just now';
  if (secs < 5400) return Math.round(secs/60)+'m ago';
  return Math.round(secs/3600)+'h ago';
}

function renderTotals(){
  const evs = DATA.events || [];
  const sum = f => { const v = evs.map(f).filter(x => x != null); return v.length ? v.reduce((a,b)=>a+b,0) : null; };
  const w24 = sum(e => { const w=(e.windows||{})['24h']; return w ? w.sold : null; });
  const tiles = [
    ['Events listed', evs.length, ''],
    ['Tickets left', sum(e => e.total_available), 'at current prices'],
    ['Sold last 24h', w24, 'from 10-min snapshots'],
    ['Σ sold since tracking', sum(e => e.sold_cum), 'counting from ' + ((evs.map(e=>e.sold_cum_since).filter(Boolean).sort()[0]||'').slice(0,10))],
    ['Low-stock now', evs.filter(e => e.on_sale && e.ga_available != null && e.ga_available <= (DATA.low_stock_threshold||20)).length, '≤' + (DATA.low_stock_threshold||20) + ' left in GA release'],
  ];
  $('totals').innerHTML = tiles.map(([l,v,h]) =>
    `<div class="stat"><div class="label">${l}</div><div class="value ${l.includes('24h') ? 'green' : ''}${v ? '' : ' zero'}">${fmt(v)}</div>${h ? `<div class="hint">${h}</div>` : ''}</div>`
  ).join('');
  const s = DATA.status || {};
  $('statusline').textContent = `Monitor: ${s.enabled ? 'on' : 'OFF'} · every ${s.interval_minutes} min · last check ${fmtAgo(s.at)}` +
    (s.error ? ` · ⚠ ${s.error}` : '') + ` · pings last tick: ${['new','onsale','price_up','price_down','low_stock'].map(k => `${k} ${s[k]??0}`).join(', ')}`;
  $('meta').textContent = `${evs.length} events`;
  $('footnote').textContent = 'Counts are per-release (a new release adds inventory at a higher price). +1h/+6h/… = actual tickets sold in that window; * = limited history. Σ Sold = everything sold since tracking began. Pace = avg sold/day over the last 3 full days vs the 3 before (▲/▼ at ±15%); the mini bars are the last 14 days. Click a row for the full sold-per-day chart. Release history logs every release from first sighting (releases already open when logging started show that date). BUY opens the event page\'s tickets section (the FourVenues iframe checkout adds tax).';
}

async function load(){
  try {
    const r = await fetch('/api/pacha');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    for (const k in HOURLY) HOURLY[k].stale = true;
    $('errbox').style.display = 'none';
    renderTotals(); renderOverview(); render();
  } catch (e) {
    $('errbox').textContent = 'Failed to load: ' + e.message;
    $('errbox').style.display = 'block';
  }
}
$('q').addEventListener('input', render);
load();
setInterval(load, 120000);
</script>
</body>
