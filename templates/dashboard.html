<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kartis — Inventory</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 24px; color: #1a1a1a; }
  h1 { margin: 0 0 4px; }
  .sub { color: #666; margin-bottom: 16px; font-size: 13px; }
  .bar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  button, a.btn { padding: 8px 14px; border: 1px solid #333; background: #fff; border-radius: 6px; cursor: pointer; text-decoration: none; color: #1a1a1a; font-size: 14px; }
  button:hover, a.btn:hover { background: #f0f0f0; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: #f5f5f5; padding: 10px 14px; border-radius: 8px; }
  .stat .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid #eee; padding: 8px 10px; text-align: left; }
  th { background: #fafafa; font-weight: 600; position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .profit-pos { color: #0a7f2e; font-weight: 600; }
  .profit-neg { color: #b00020; font-weight: 600; }
  .err { background: #fee; color: #900; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
  .empty { color: #888; padding: 24px; text-align: center; }
  .evt { font-weight: 600; }
  .evt-meta { color: #777; font-size: 12px; }
</style>
</head>
<body>
<h1>Kartis</h1>
<div class="sub" id="lastrun">—</div>

<div id="errbox" style="display:none" class="err"></div>

<div class="stats">
  <div class="stat"><div class="label">Events</div><div class="value" id="s-events">0</div></div>
  <div class="stat"><div class="label">Listings</div><div class="value" id="s-listings">0</div></div>
  <div class="stat"><div class="label">Tickets</div><div class="value" id="s-tickets">0</div></div>
  <div class="stat"><div class="label">Total Cost</div><div class="value" id="s-cost">$0</div></div>
  <div class="stat"><div class="label">Total List</div><div class="value" id="s-list">$0</div></div>
  <div class="stat"><div class="label">P/L</div><div class="value" id="s-pl">$0</div></div>
</div>

<div class="bar">
  <button id="refresh">Refresh now</button>
  <a class="btn" href="/export.xlsx">Export to Excel</a>
</div>

<table>
  <thead>
    <tr>
      <th>Event</th>
      <th>Date</th>
      <th>Venue</th>
      <th class="num">Listings</th>
      <th class="num">Tickets</th>
      <th class="num">Cost</th>
      <th class="num">List</th>
      <th class="num">P/L</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<div id="empty" class="empty" style="display:none">No data yet. Click "Refresh now" to pull from Lysted.</div>

<script>
const money = (n) => n == null ? "—" : "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
const esc = (s) => s == null ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

async function load() {
  const res = await fetch("/api/inventory");
  const data = await res.json();
  const t = data.totals;

  document.getElementById("s-events").textContent = t.events;
  document.getElementById("s-listings").textContent = t.listings;
  document.getElementById("s-tickets").textContent = t.tickets;
  document.getElementById("s-cost").textContent = money(t.total_cost);
  document.getElementById("s-list").textContent = money(t.total_list);
  const pl = document.getElementById("s-pl");
  pl.textContent = money(t.total_pl);
  pl.className = "value " + (t.total_pl >= 0 ? "profit-pos" : "profit-neg");

  const lr = data.last_run;
  const msg = lr.running ? "Scraping now…"
    : lr.at ? "Last updated: " + new Date(lr.at).toLocaleString()
    : "No scrape has run yet.";
  document.getElementById("lastrun").textContent = msg;

  const err = document.getElementById("errbox");
  if (lr.error) { err.style.display = "block"; err.textContent = "Last scrape error: " + lr.error; }
  else { err.style.display = "none"; }

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  for (const r of data.rows) {
    const tr = document.createElement("tr");
    const plVal = r.profit_loss;
    const plClass = plVal == null ? "" : (plVal >= 0 ? "profit-pos" : "profit-neg");
    tr.innerHTML = `
      <td class="evt">${esc(r.event_name)}</td>
      <td>${esc(r.event_date)}${r.event_time ? ' <span class="evt-meta">' + esc(r.event_time) + '</span>' : ''}</td>
      <td>${esc(r.venue)}</td>
      <td class="num">${r.listings_count ?? ""}</td>
      <td class="num">${r.tickets_count ?? ""}</td>
      <td class="num">${money(r.total_cost)}</td>
      <td class="num">${money(r.total_list)}</td>
      <td class="num ${plClass}">${money(plVal)}</td>
    `;
    tbody.appendChild(tr);
  }
  document.getElementById("empty").style.display = data.rows.length ? "none" : "block";
}

document.getElementById("refresh").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = "Refreshing…";
  await fetch("/api/refresh", { method: "POST" });
  setTimeout(() => { btn.disabled = false; btn.textContent = "Refresh now"; load(); }, 4000);
});

load();
setInterval(load, 15000);
</script>
</body>
</html>
