<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#16181d; --mut:#6b7280; --line:#e5e7eb; --acc:#2563eb; --ok:#059669; --bad:#dc2626; --chip:#f3f4f6; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --fg:#e8eaee; --mut:#9aa1ad; --line:#2c3038; --acc:#5b8cff; --ok:#34d399; --bad:#f87171; --chip:#23262d; --warn:#fbbf24; } }
  body { margin:0; width:400px; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:14px; }
  main { padding:10px 12px; max-height:560px; overflow:auto; }
  .mut { color:var(--mut); } .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .ev { font-weight:600; font-size:14px; margin:2px 0; }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); }
  input[type=text], input[type=number], input[type=password], select {
    font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 7px; }
  input[type=number] { width:72px; }
  input.sm { width:58px; padding:3px 5px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { border:1px solid var(--line); background:var(--chip); border-radius:999px; padding:2px 9px; cursor:pointer; font-size:12px; user-select:none; }
  .chip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  button { font:inherit; border:0; border-radius:6px; padding:7px 12px; background:var(--acc); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); padding:3px 8px; }
  button.ghost.on { color:var(--warn); border-color:var(--warn); }
  h3 { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:14px 0 4px; display:flex; justify-content:space-between; }
  h3 span { text-transform:none; letter-spacing:0; font-weight:400; }
  .rule { border-top:1px solid var(--line); padding:6px 0; }
  .rule .what { font-size:12px; }
  .rule.off .what { opacity:.5; text-decoration:line-through; }
  .rule .ctl { display:flex; gap:6px; align-items:center; margin-top:4px; font-size:12px; color:var(--mut); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:3px 4px; border-top:1px solid var(--line); vertical-align:top; }
  tr.sec { cursor:pointer; }
  tr.sec:hover td { background:var(--chip); }
  tr.sec.on td { background:color-mix(in srgb, var(--acc) 18%, transparent); }
  td.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pl { font-size:10px; border-radius:4px; padding:0 4px; border:1px solid var(--line); color:var(--mut); white-space:nowrap; }
  .scroll { max-height:190px; overflow:auto; }
  .ping { font-size:12px; border-top:1px solid var(--line); padding:4px 0; }
  #settings { display:none; border-top:1px solid var(--line); padding-top:8px; margin-top:10px; }
</style>
</head>
<body>
<header><b>B2B Snipes</b><button class="ghost" id="gear" title="Settings">⚙</button></header>
<main>
  <div id="msg" class="mut">Loading…</div>
  <div id="body" style="display:none">
    <div class="mut" id="site"></div>
    <div class="ev" id="evName"></div>
    <div class="mut" id="evMeta"></div>
    <div class="row" id="evCtl" style="display:none">
      <button class="ghost" id="pauseBtn">Pause</button>
      <button class="ghost" id="muteBtn">Mute pings</button>
      <span class="mut" id="evState"></span>
    </div>

    <h3>Rules</h3>
    <div id="rules"></div>

    <h3>Sections <span id="secSrc"></span></h3>
    <div class="chips" id="zoneChips"></div>
    <div class="scroll"><table id="secTable"></table></div>

    <h3>New rule</h3>
    <div class="row" id="kindRow">
      <label>Ping when
        <select id="kind">
          <option value="under">a ticket is listed at or under</option>
          <option value="offer_over">an offer is at or over</option>
          <option value="arb">offer beats a B2B ask by at least</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Price $ (all-in, each)<input type="number" id="price" min="0" step="1"></label>
      <label>Min qty<input type="number" id="minQty" min="1" value="1"></label>
    </div>
    <div class="mut" style="font-size:12px">Sections: <span id="pickedTxt">any</span></div>
    <div class="row">
      <input type="text" id="secCustom" placeholder="other sections, comma separated" style="flex:1">
    </div>
    <div class="row" id="unmappedRow">
      <label style="flex-direction:row;align-items:center;gap:6px;color:var(--fg)"><input type="checkbox" id="unmapped" checked> include TickPick unmapped listings</label>
    </div>
    <div class="row"><button id="save">Add rule</button><span id="saved" class="mut"></span></div>
    <div class="mut" style="font-size:12px" id="scopeNote"></div>

    <div id="pingsBox" style="display:none">
      <h3>Recent pings</h3>
      <div id="pings"></div>
    </div>
  </div>

  <div id="settings">
    <div class="row"><label style="flex:1">Kartis URL<input type="text" id="sBase" value="https://kartis.homes"></label></div>
    <div class="row">
      <label>Site user<input type="text" id="sUser"></label>
      <label>Site password<input type="password" id="sPass"></label>
    </div>
    <div class="row"><button id="sSave">Save</button><span class="mut" id="sMsg"></span></div>
  </div>
</main>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
